# IPower Investments on the client machine. Uses pre-built images loaded with `docker load` – no source, no build.
# Start: docker compose up -d   ·   open http://localhost:3000
name: flcrm

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flcrm
      # Used only when the database is first created; changing it later locks the app out.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flcrm}
      POSTGRES_DB: flcrm
    # No ports: only the app container talks to the database.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flcrm"]
      interval: 5s
      retries: 10

  app:
    image: ipower-crm:1.1
    pull_policy: never
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://flcrm:${POSTGRES_PASSWORD:-flcrm}@postgres:5432/flcrm
      INSTALL_MODE: ${INSTALL_MODE:-demo}
      SETUP_OWNER_NAME: ${SETUP_OWNER_NAME:-}
      SETUP_OWNER_USERNAME: ${SETUP_OWNER_USERNAME:-}
      SETUP_OWNER_PASSWORD: ${SETUP_OWNER_PASSWORD:-}
      SETUP_CASH_OPENING: ${SETUP_CASH_OPENING:-0}
      SETUP_WALLET_OPENING: ${SETUP_WALLET_OPENING:-0}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - bills:/app/storage

volumes:
  pgdata:
  bills:
