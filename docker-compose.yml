services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flcrm
      POSTGRES_PASSWORD: flcrm
      POSTGRES_DB: flcrm
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flcrm"]
      interval: 5s
      retries: 10

  # The whole demo: `docker compose up -d --build`, then open http://localhost:3000
  app:
    build: .
    image: ipower-crm:1.1   # tag used by `docker save` for the client package (deploy/INSTALL.md)
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://flcrm:flcrm@postgres:5432/flcrm
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - bills:/app/storage

volumes:
  pgdata:
  bills:
